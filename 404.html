<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Arizona Rabbits</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241F1D">

<!-- ═══════════════════════════════════════════════════════════════
     WHY THIS FILE EXISTS.

     Before it, arizonarabbits.com answered EVERY address with the
     home page and an HTTP 200. A made-up URL like /not-a-real-page
     came back as a success carrying the whole site. That is a soft
     404, and it is bad in two directions: a search engine treats
     every wrong address as a real, indexable duplicate of the home
     page, and a visitor who mistypes a link sees the front page with
     no idea anything went wrong.

     Cloudflare Pages serves this file, with a real 404 status, for
     any address that does not match a file.

     IF THE SOFT 404 SURVIVES THIS FILE, the repo has a catch-all
     redirect in it. Look for a file called `_redirects` and a line
     like `/*  /index.html  200`. Delete that line. It is an SPA rule
     and this is not an SPA.
     ═══════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"></noscript>

<style>
:root{
  color-scheme:light;
  --paper:#FBF8F3; --ink:#241F1D; --ink-soft:#57504A; --ink-faint:#736A64;  /* was #8B817A = 3.59:1 on paper, which fails WCAG AA.
     Darkened on index.html and MISSED HERE for days: the four pages each carry
     their own copy of the palette, so a fix to one silently leaves the others
     behind. palettetest.js now fails the build when any token drifts between
     pages. Do not lighten this back. */
  --line:#E3DACC; --brick:#A0522D; --brick-dk:#7C3E21;
  --serif:'Fraunces',ui-serif,Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 22px}
.box{max-width:30rem;text-align:center}
.mark{width:78px;height:78px;margin:0 auto 22px;display:block}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,5vw,34px);
  letter-spacing:-.02em;line-height:1.15;margin-bottom:12px;text-wrap:balance}
p{color:var(--ink-soft);margin-bottom:26px;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;padding:0 22px;border-radius:100px;font-weight:600;
  font-size:15.5px;text-decoration:none;border:1px solid var(--line);
  background:#fff;color:var(--ink)}
.btn.primary{background:var(--brick);border-color:var(--brick);color:#fff}
.btn:hover{border-color:var(--brick);color:var(--brick-dk)}
.btn.primary:hover{background:var(--brick-dk);color:#fff}
small{display:block;margin-top:22px;font-size:13.5px;color:var(--ink-faint)}
</style>
</head>
<body>

<div class="box">
  <!-- the same house rabbit used as the photo placeholder, so a wrong
       turn still looks like this site rather than a server error -->
  <svg class="mark" viewBox="0 0 200 150" aria-hidden="true">
    <g fill="#CBBBA8">
      <ellipse cx="88" cy="108" rx="31" ry="25"/>
      <circle cx="121" cy="86" r="17"/>
      <ellipse cx="115" cy="52" rx="5.8" ry="22" transform="rotate(-12 115 52)"/>
      <ellipse cx="130" cy="54" rx="5.4" ry="20" transform="rotate(8 130 54)"/>
      <circle cx="58" cy="102" r="7.5"/>
    </g>
    <circle cx="127" cy="83" r="2.2" fill="#FBF8F3"/>
  </svg>

  <h1>That page isn't here</h1>
  <p>Either the link was wrong or I moved something. The rabbits I have right now
  are all on the front page.</p>

  <div class="row">
    <a class="btn primary" href="/">See the rabbits</a>
    <a class="btn" href="/litters">Past litters</a>
  </div>

  <small>Still stuck? Call or text me on <a href="tel:+15202702827"
    style="color:var(--brick-dk);font-weight:600">(520) 270-2827</a></small>
</div>

</body>
</html>
